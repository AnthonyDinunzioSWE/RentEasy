{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center h-screen bg-gray-900">
    <div class="bg-gray-800 text-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-semibold mb-6 text-center">Login</h2>
        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium">Email</label>
                <input type="email" id="email" name="email" required class="w-full p-2 rounded-lg bg-gray-700 text-white focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium">Password</label>
                <input type="password" id="password" name="password" required class="w-full p-2 rounded-lg bg-gray-700 text-white focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Login</button>
        </form>
    </div>
</div>
{% endblock %}
