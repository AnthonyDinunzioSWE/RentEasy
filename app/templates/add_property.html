{% extends "base.html" %}

{% block content %}
<div class="p-8">
    <h1 class="text-3xl font-semibold text-white mb-4">Add Property</h1>

    <form method="POST" action="{{ url_for('main.add_property') }}">
        <div class="mb-4">
            <label for="address" class="block text-sm font-medium">Address</label>
            <input type="text" name="address" id="address" class="w-full p-2 bg-gray-700 text-white border border-gray-600 rounded focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-4">
            <label for="unit_number" class="block text-sm font-medium">Unit Number</label>
            <input type="text" name="unit_number" id="unit_number" class="w-full p-2 bg-gray-700 text-white border border-gray-600 rounded focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-4">
            <label for="rent_amount" class="block text-sm font-medium">Rent Amount</label>
            <input type="text" name="rent_amount" id="rent_amount" class="w-full p-2 bg-gray-700 text-white border border-gray-600 rounded focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-4">
            <label for="status" class="block text-sm font-medium">Status</label>
            <select name="status" id="status" class="w-full p-2 bg-gray-700 text-white border border-gray-600 rounded focus:ring-2 focus:ring-blue-500">
                <option value="Available">Available</option>
                <option value="Occupied">Occupied</option>
            </select>
        </div>
        <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500">Add Property</button>
    </form>
</div>
{% endblock %}
